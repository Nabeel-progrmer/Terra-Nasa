services:
  - type: web
    name: terra-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://terra-nasa-m2wm.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
