<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111d" />
    <title>TERRA is offline</title>
    <style>
      :root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#081116;color:#e9f0f4}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}.card{width:min(100%,520px);padding:28px;border:1px solid #ffffff20;border-radius:14px;background:#101b21}img{width:56px;height:56px}h1{margin:22px 0 8px;font-size:clamp(25px,6vw,34px)}p{color:#adbdc0}strong{color:#c3e889}button{min-height:44px;padding:10px 15px;border:0;border-radius:7px;background:#c3e889;color:#142018;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #8bd6db;outline-offset:3px}
    </style>
  </head>
  <body><main class="card"><img src="/icon-192.png" alt="" /><h1>You’re offline</h1><p>The TERRA app shell is available, but live Earth and space data requires an internet connection. Previously visible measurements may be out of date; check each source timestamp before interpreting them.</p><p><strong>Scientific data is not refreshed or presented as live while offline.</strong></p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
